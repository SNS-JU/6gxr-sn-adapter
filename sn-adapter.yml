apiVersion: apps/v1
kind: Deployment
metadata:
  name: sn-adapter
  namespace: default
  labels:
    app: nef-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nef-proxy
  template:
    metadata:
      labels:
        app: nef-proxy
    spec:
      containers:
      
      - name: sn-adapter
        image: registry.gitlab.com/connectivity-and-networking/6g-xr/south-node-adapter/sn-adapter:3.3.1.6
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
        env:
          - name: KUBERNETES_TRUST_CERTIFICATES
            value: "true"
          - name: JAVA_OPTS
            value: "-Djavax.net.ssl.trustAll=true -Djavax.net.ssl.trustStoreType=JKS -Dfeign.client.httpclient.disableSslValidation=true"

      - name: mongodb-6g-xr
        image: {{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}
        ports:
          - containerPort: 27017  # Make sure port matches with the one in Service
        volumeMounts:
          - name: mongodb-6g-xr-data
            mountPath: /data/db

---
apiVersion: v1
kind: Service
metadata:
  name: nef-proxy-svc
  namespace: nef
spec:
  type: NodePort
  selector:
    app: nef-proxy
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30801
