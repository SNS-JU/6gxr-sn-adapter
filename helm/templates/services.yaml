apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mongodb-6g-xr
  labels:
    app: {{ .Release.Name }}-mongodb-6g-xr
spec:
  type: LoadBalancer
#  externalIPs:
#    - 10.6.71.75  # Specify the static IP here
  ports:
    - port: 27018        # Port exposed out of the cluster
      targetPort: 27017  # Must match with containerPort in Deployment
      name: mongodb-6g-xr
      nodePort: 30018    # Assign nodePort explicitly
  selector:
    app: 6g-xr  # Make sure this selector matches label in Deployment
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sn-adapter
  labels:
    app: {{ .Release.Name }}-sn-adapter
spec:
  type: LoadBalancer
  externalIPs:
    - 193.166.32.46  # Specify the static IP here
  ports:
    - port: 8081        # Exposed port outside the cluster
      targetPort: 8080  # Container port
      name: exist-port
      nodePort: 30081    # Assigns the nodePort explicitly
  selector:
    app: 6g-xr  # Make sure it matches with label in Deployment
